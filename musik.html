<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musik | True Crime Denmark</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            font-family: Calibri, sans-serif;
        }

        .container {
            width: 80%;
            margin: auto;
            background-color: white;
            min-height: 100vh;
            padding: 30px;
            box-sizing: border-box;
        }

        h1, h2 {
            text-align: center;
        }

        /* KÁRTYÁK */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            display: block;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            background: #f4f4f4;
            text-decoration: none;
            color: black;
            transition: 0.3s;
        }

        .card i {
            font-size: 30px;
            margin-bottom: 10px;
            color: darkred;
        }

        .card:hover {
            transform: scale(1.05);
            background: #e9e9e9;
        }

        /* ALSÓ MENÜ */
        .footer-menu {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        a {
            color: darkred;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html">← Tilbage til forsiden</a>

    <h2>Musik</h2>

    <!-- ZENEKAROS KÁRTYÁK -->
    <div class="grid">

        <a class="card" href="baccara.html">
            <i class="fa-solid fa-music"></i>
            <h3>Baccara</h3>
        </a>

        <a class="card" href="dschinghis_khan.html">
            <i class="fa-solid fa-drum"></i>
            <h3>Dschinghis Khan</h3>
        </a>

        <a class="card" href="cest_la_vie.html">
            <i class="fa-solid fa-heart"></i>
            <h3>C'est la Vie</h3>
        </a>

        <a class="card" href="mayhem.html">
            <i class="fa-solid fa-skull"></i>
            <h3>Mayhem</h3>
        </a>

    </div>

    <!-- ALSÓ IKONOS MENÜ -->
    <div class="footer-menu">

        <a class="card" href="omos.html">
            <i class="fa-solid fa-circle-info"></i>
            <h3>Om os</h3>
        </a>

        <a class="card" href="vilkar.html">
            <i class="fa-solid fa-file-contract"></i>
            <h3>Vilkår</h3>
        </a>

        <a class="card" href="disclaimer.html">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3>Disclaimer</h3>
        </a>

        <a class="card" href="privatlivspolitik.html">
            <i class="fa-solid fa-user-shield"></i>
            <h3>Privatliv</h3>
        </a>

        <a class="card" href="kontakt.html">
            <i class="fa-solid fa-envelope"></i>
            <h3>Kontakt</h3>
        </a>

    </div>

</div>

</body>
</html>
